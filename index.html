<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yara's Study · Poison Genius Consort 2</title>
<style>
  :root {
    --bg: #F7F4F2;
    --bg-soft: #F1EBE7;
    --paper: #FDFAF7;
    --ink: #3A2A2A;
    --ink-soft: #7A655F;
    --crimson: #8B2E2E;
    --crimson-deep: #5C1A1A;
    --accent: #D42A2A;
    --pink: #E8B4B8;
    --line: #E3D9D3;
    --shadow: 0 6px 24px rgba(92,26,26,.10), 0 2px 6px rgba(92,26,26,.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "PingFang SC", sans-serif;
    overflow-x: hidden;
  }
  ::selection { background: var(--pink); }

  /* ============ Shelf ============ */
  #shelf { min-height: 100vh; display: flex; flex-direction: column; }
  .hero {
    text-align: center;
    padding: 56px 24px 36px;
    background: linear-gradient(180deg, #FBF8F5 0%, var(--bg) 100%);
    position: relative;
    overflow: hidden;
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    width: 240px; height: 120px;
    background: radial-gradient(ellipse at center, rgba(232,180,184,.35) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero::before { top: -30px; left: -60px; }
  .hero::after { bottom: -20px; right: -60px; }
  .hero .seal {
    display: inline-block;
    font-size: 12px; letter-spacing: 4px;
    color: var(--accent);
    border: 1px solid rgba(212,42,42,.35);
    padding: 4px 12px 4px 16px;
    border-radius: 2px;
    margin-bottom: 18px;
    font-weight: 500;
  }
  .hero h1 {
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 600;
    color: var(--crimson-deep);
    letter-spacing: .5px;
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    line-height: 1.25;
  }
  .hero .sub {
    margin-top: 12px;
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 1.5px;
  }
  .hero .divider {
    width: 72px; height: 2px;
    margin: 24px auto 0;
    background: linear-gradient(90deg, transparent, var(--crimson), transparent);
  }

  .continue-bar {
    max-width: 1080px; margin: 0 auto; padding: 0 24px;
    width: 100%;
  }
  .continue-card {
    display: none;
    align-items: center; gap: 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 3px solid var(--crimson);
    border-radius: 10px;
    padding: 14px 20px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .continue-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(92,26,26,.14); }
  .continue-card.show { display: flex; }
  .continue-card img { width: 44px; height: 62px; object-fit: cover; border-radius: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .continue-card .ct { font-size: 15px; font-weight: 600; color: var(--crimson-deep); }
  .continue-card .cp { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .continue-card .go {
    margin-left: auto; flex-shrink: 0;
    font-size: 13px; color: var(--crimson);
    border: 1px solid rgba(139,46,46,.3);
    padding: 6px 16px; border-radius: 20px;
    white-space: nowrap;
  }

  .grid {
    max-width: 1080px; margin: 32px auto 64px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 28px 22px;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .25s, box-shadow .25s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 14px 34px rgba(92,26,26,.16); }
  .card .cover-wrap { position: relative; aspect-ratio: 5/7; background: var(--bg-soft); }
  .card .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(92,26,26,.78);
    color: #F5E9E0;
    font-size: 10px; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 3px;
    backdrop-filter: blur(2px);
    text-transform: uppercase;
  }
  .card .badge.done { background: rgba(46,110,84,.85); }
  .card .progress-line {
    position: absolute; left: 0; bottom: 0; height: 3px;
    background: var(--accent);
  }
  .card .info { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; }
  .card .vol { font-size: 11px; color: var(--ink-soft); letter-spacing: 1.5px; text-transform: uppercase; }
  .card .name {
    margin-top: 4px;
    font-size: 14px; font-weight: 600; color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .pct { margin-top: 6px; font-size: 12px; color: var(--crimson); }
  .card .pct.zero { color: var(--ink-soft); opacity: .55; }

  footer {
    text-align: center; padding: 28px 20px 40px;
    color: var(--ink-soft); font-size: 12px; letter-spacing: 1.5px;
  }

  /* ============ Reader ============ */
  #reader {
    position: fixed; inset: 0; z-index: 100;
    background: var(--paper);
    display: none; flex-direction: column;
  }
  #reader.open { display: flex; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(180deg, #FBF7F3, #F6F0EB);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .topbar .btn {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--crimson-deep);
    border-radius: 8px;
    padding: 7px 13px;
    font-size: 14px; cursor: pointer;
    transition: background .15s;
    white-space: nowrap;
    user-select: none;
  }
  .topbar .btn:hover { background: #FFF; border-color: var(--pink); }
  .topbar .title {
    flex: 1; text-align: center;
    font-size: 15px; font-weight: 600; color: var(--crimson-deep);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: Georgia, "Times New Roman", serif;
  }
  .topbar .title .vol-tag { color: var(--ink-soft); font-weight: 400; font-size: 12px; margin-left: 6px; }

  #viewer {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #viewer iframe { border: none; }

  .pagebar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 12px;
    background: #F6F0EB;
    border-top: 1px solid var(--line);
  }
  .pagebar .pct { flex: 1; text-align: center; font-size: 12px; color: var(--ink-soft); letter-spacing: 1px; }
  .nav-btn {
    border: 1px solid var(--line); background: var(--paper);
    color: var(--crimson); border-radius: 8px;
    width: 44px; height: 34px; font-size: 16px;
    cursor: pointer; user-select: none;
  }
  .nav-btn:active { background: var(--pink); }
  .nav-btn:disabled { opacity: .35; cursor: default; }

  .tapzone { position: absolute; top: 0; bottom: 0; width: 22%; z-index: 5; cursor: pointer; }
  .tapzone.left { left: 0; }
  .tapzone.right { right: 0; }

  /* TOC drawer */
  #toc-panel {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 200;
    width: min(320px, 82vw);
    background: var(--paper);
    box-shadow: 6px 0 24px rgba(0,0,0,.12);
    transform: translateX(-102%);
    transition: transform .28s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
  }
  #toc-panel.open { transform: translateX(0); }
  #toc-panel .toc-head {
    padding: 16px 18px;
    font-weight: 600; color: var(--crimson-deep);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px;
  }
  #toc-panel .toc-head .close { cursor: pointer; color: var(--ink-soft); font-size: 18px; padding: 2px 6px; }
  #toc-panel .toc-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  #toc-panel .toc-item {
    padding: 10px 18px; font-size: 13.5px;
    color: var(--ink); cursor: pointer;
    border-left: 2px solid transparent;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #toc-panel .toc-item:hover { background: var(--bg-soft); border-left-color: var(--pink); }
  #toc-panel .toc-item.active { color: var(--crimson); border-left-color: var(--crimson); font-weight: 600; background: #FBF4F1; }
  #toc-mask {
    position: fixed; inset: 0; z-index: 190;
    background: rgba(58,42,42,.28);
    display: none;
  }
  #toc-mask.show { display: block; }

  /* Reader theme: paper / night */
  #reader.night { --paper: #2B2422; background: #2B2422; }
  #reader.night .topbar { background: #241E1C; border-bottom-color: #3D3430; }
  #reader.night .topbar .btn { background: #332B28; color: #E8D9D2; border-color: #453B37; }
  #reader.night .topbar .title { color: #E8D9D2; }
  #reader.night .pagebar { background: #241E1C; border-top-color: #3D3430; }
  #reader.night .pct, #reader.night .topbar .title .vol-tag { color: #A89188; }
  #reader.night .nav-btn { background: #332B28; color: #E8D9D2; border-color: #453B37; }

  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(8px);
    background: rgba(92,26,26,.92); color: #F5E9E0;
    padding: 8px 20px; border-radius: 20px; font-size: 13px;
    opacity: 0; transition: all .25s; pointer-events: none; z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .grid { gap: 20px 14px; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); padding: 0 16px; }
    .hero { padding: 40px 16px 28px; }
    .topbar .title { font-size: 13px; }
    .topbar .btn { padding: 7px 10px; font-size: 13px; }
  }
</style>
</head>
<body>

<!-- ============ Shelf ============ -->
<div id="shelf">
  <div class="hero">
    <div class="seal">YARA'S STUDY</div>
    <h1>Poison Genius Consort 2<br>Emperor&rsquo;s Swallow</h1>
    <div class="sub">BY JIE MO &middot; ANCIENT ROMANCE &middot; COMPLETE IN 11 VOLUMES</div>
    <div class="divider"></div>
  </div>

  <div class="continue-bar">
    <div class="continue-card" id="continue-card">
      <img id="cont-cover" src="" alt="">
      <div>
        <div class="ct" id="cont-title"></div>
        <div class="cp" id="cont-pct"></div>
      </div>
      <div class="go">Continue Reading &rarr;</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>YARA'S STUDY &middot; A QUIET PLACE FOR GOOD BOOKS</footer>
</div>

<!-- ============ Reader ============ -->
<div id="reader">
  <div class="topbar">
    <button class="btn" id="btn-back">&larr; Shelf</button>
    <button class="btn" id="btn-toc">Contents</button>
    <div class="title"><span id="rd-title">…</span><span class="vol-tag" id="rd-vol"></span></div>
    <button class="btn" id="btn-fontminus" title="Smaller text">A-</button>
    <button class="btn" id="btn-fontplus" title="Larger text">A+</button>
    <button class="btn" id="btn-theme" title="Toggle night mode">🌙</button>
  </div>

  <div id="viewer">
    <div class="tapzone left" id="tap-left"></div>
    <div class="tapzone right" id="tap-right"></div>
  </div>

  <div class="pagebar">
    <button class="nav-btn" id="btn-prev">‹</button>
    <div class="pct" id="rd-pct">…</div>
    <button class="nav-btn" id="btn-next">›</button>
  </div>
</div>

<!-- TOC drawer -->
<div id="toc-mask"></div>
<div id="toc-panel">
  <div class="toc-head"><span>Contents</span><span class="close" id="toc-close">✕</span></div>
  <div class="toc-list" id="toc-list"></div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/jszip.min.js"></script>
<script src="vendor/epub.min.js"></script>
<script>
  const BOOKS = [];
  for (let i = 1; i <= 11; i++) {
    BOOKS.push({ vol: i, file: `books/vol${i}.epub`, cover: `books/cover${i}.jpeg`, title: `Emperor's Swallow · Vol ${i}` });
  }
  const SERIES = "Poison Genius Consort 2";

  const LS = {
    cfi: i => `pgc2-cfi-${i}`,
    pct: i => `pgc2-pct-${i}`,
    last: 'pgc2-last',
    theme: 'pgc2-theme',
    font: 'pgc2-font'
  };

  // ---------- Shelf rendering ----------
  const grid = document.getElementById('grid');
  function renderShelf() {
    grid.innerHTML = '';
    BOOKS.forEach(b => {
      const pct = parseFloat(localStorage.getItem(LS.pct(b.vol)) || 0);
      const done = pct >= 99;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="cover-wrap">
          <img src="${b.cover}" alt="Vol ${b.vol}" loading="lazy">
          ${done ? '<span class="badge done">Finished</span>' : (pct > 0 ? `<span class="badge">At ${Math.floor(pct)}%</span>` : '')}
          <div class="progress-line" style="width:${pct}%"></div>
        </div>
        <div class="info">
          <div class="vol">Volume ${b.vol}</div>
          <div class="name">${b.title}</div>
          <div class="pct ${pct > 0 ? '' : 'zero'}">${pct > 0 ? Math.floor(pct) + '% read' : 'Not started'}</div>
        </div>`;
      card.addEventListener('click', () => openBook(b.vol));
      grid.appendChild(card);
    });
    // Continue-reading card
    const last = localStorage.getItem(LS.last);
    const cc = document.getElementById('continue-card');
    if (last !== null) {
      const b = BOOKS[parseInt(last) - 1];
      const pct = parseFloat(localStorage.getItem(LS.pct(b.vol)) || 0);
      document.getElementById('cont-cover').src = b.cover;
      document.getElementById('cont-title').textContent = `${SERIES} · Volume ${b.vol}`;
      document.getElementById('cont-pct').textContent = pct > 0 ? `${Math.floor(pct)}% read — pick up where you left off` : 'Start from page one';
      cc.classList.add('show');
      cc.onclick = () => openBook(b.vol);
    } else {
      cc.classList.remove('show');
      cc.onclick = () => openBook(1);
    }
  }
  renderShelf();

  // ---------- Reader ----------
  const readerEl = document.getElementById('reader');
  let book = null, rendition = null, curVol = 1, fontSize = parseFloat(localStorage.getItem(LS.font) || 17);

  function openBook(vol) {
    curVol = vol;
    localStorage.setItem(LS.last, String(vol));
    readerEl.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('rd-title').textContent = SERIES;
    document.getElementById('rd-vol').textContent = `· Volume ${vol}`;
    document.getElementById('rd-pct').textContent = 'Loading…';

    if (rendition) { rendition.destroy(); }
    if (book) { book.destroy(); }

    book = ePub(`books/vol${vol}.epub`);
    rendition = book.renderTo('viewer', {
      width: '100%', height: '100%',
      spread: 'none', flow: 'paginated'
    });

    applyTheme(true);
    applyFont(true);

    const saved = localStorage.getItem(LS.cfi(vol));
    rendition.display(saved || undefined);

    // TOC
    book.loaded.navigation.then(nav => {
      const list = document.getElementById('toc-list');
      list.innerHTML = '';
      const flatten = (items, depth) => items.forEach(it => {
        const div = document.createElement('div');
        div.className = 'toc-item';
        div.style.paddingLeft = (18 + depth * 14) + 'px';
        div.textContent = it.label.trim() || '(Untitled)';
        div.addEventListener('click', () => {
          rendition.display(it.href);
          closeToc();
        });
        list.appendChild(div);
        if (it.subitems && it.subitems.length) flatten(it.subitems, depth + 1);
      });
      flatten(nav.toc, 0);
    });

    // Progress
    rendition.on('relocated', loc => {
      const pct = loc.start ? loc.start.percentage : (loc.percentage || 0);
      if (pct !== undefined && pct !== null && !isNaN(pct)) {
        localStorage.setItem(LS.pct(vol), (pct * 100).toFixed(1));
        localStorage.setItem(LS.cfi(vol), loc.start.cfi);
        document.getElementById('rd-pct').textContent =
          `${Math.floor(pct * 100)}% · Page ${loc.start.displayed.page + 1} of ${loc.start.displayed.total}`;
      }
    });

    rendition.on('keydown', e => {
      if (e.key === 'ArrowLeft') rendition.prev();
      if (e.key === 'ArrowRight') rendition.next();
    });

    rendition.on('rendered', () => {
      const cur = rendition.currentLocation();
      if (cur && cur.start && cur.start.percentage != null) {
        localStorage.setItem(LS.pct(vol), (cur.start.percentage * 100).toFixed(1));
        localStorage.setItem(LS.cfi(vol), cur.start.cfi);
        document.getElementById('rd-pct').textContent =
          `${Math.floor(cur.start.percentage * 100)}% · Page ${cur.start.displayed.page + 1} of ${cur.start.displayed.total}`;
      }
    });
  }

  function closeBook() {
    readerEl.classList.remove('open');
    document.body.style.overflow = '';
    renderShelf();
    if (rendition) rendition.destroy();
    if (book) book.destroy();
    rendition = null; book = null;
  }

  // ---------- Controls ----------
  document.getElementById('btn-back').addEventListener('click', closeBook);
  document.getElementById('btn-prev').addEventListener('click', () => rendition && rendition.prev());
  document.getElementById('btn-next').addEventListener('click', () => rendition && rendition.next());
  document.getElementById('tap-left').addEventListener('click', () => rendition && rendition.prev());
  document.getElementById('tap-right').addEventListener('click', () => rendition && rendition.next());

  document.addEventListener('keydown', e => {
    if (!readerEl.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') rendition && rendition.prev();
    if (e.key === 'ArrowRight') rendition && rendition.next();
    if (e.key === 'Escape') closeToc();
  });

  function applyFont(silent) {
    if (!rendition) return;
    rendition.themes.default({
      'body': { 'font-size': fontSize + 'px !important' },
      'p': { 'font-size': fontSize + 'px !important', 'line-height': '1.9 !important' }
    });
    localStorage.setItem(LS.font, fontSize);
    if (!silent) toast('Font size ' + fontSize + 'px');
  }
  document.getElementById('btn-fontplus').addEventListener('click', () => {
    if (fontSize < 26) { fontSize += 1; applyFont(); }
  });
  document.getElementById('btn-fontminus').addEventListener('click', () => {
    if (fontSize > 12) { fontSize -= 1; applyFont(); }
  });

  function applyTheme(silent) {
    const night = localStorage.getItem(LS.theme) === 'night';
    readerEl.classList.toggle('night', night);
    document.getElementById('btn-theme').textContent = night ? '☀️' : '🌙';
    if (rendition) {
      rendition.themes.register('night', { 'body': { 'color': '#D8CCC5 !important', 'background': '#2B2422 !important' } });
      rendition.themes.select(night ? 'night' : 'default');
    }
    if (!silent) toast(night ? 'Night mode' : 'Day mode');
  }
  document.getElementById('btn-theme').addEventListener('click', () => {
    localStorage.setItem(LS.theme, localStorage.getItem(LS.theme) === 'night' ? 'day' : 'night');
    applyTheme();
  });

  // ---------- TOC drawer ----------
  const tocPanel = document.getElementById('toc-panel');
  const tocMask = document.getElementById('toc-mask');
  function closeToc() { tocPanel.classList.remove('open'); tocMask.classList.remove('show'); }
  document.getElementById('btn-toc').addEventListener('click', () => {
    tocPanel.classList.toggle('open'); tocMask.classList.toggle('show');
  });
  document.getElementById('toc-close').addEventListener('click', closeToc);
  tocMask.addEventListener('click', closeToc);

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }
</script>
</body>
</html>
